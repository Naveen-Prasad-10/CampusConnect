<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventBot — College Event Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f1a;
      --surface: #13162b;
      --elevated: #1b1f38;
      --border: rgba(255, 255, 255, 0.07);
      --accent: #7c6ff7;
      --accent-2: #5b8cf7;
      --glow: rgba(124, 111, 247, 0.35);
      --text: #e8eaf6;
      --muted: #7b82a8;
      --bubble-u: linear-gradient(135deg, #7c6ff7, #5b8cf7);
      --bubble-b: #1b1f38;
      --radius: 18px;
      --transition: 0.25s ease;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ─── Animated background blobs ─────────────────────── */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      pointer-events: none;
      animation: float 12s ease-in-out infinite alternate;
      z-index: 0;
    }

    .bg-blob.a {
      width: 520px;
      height: 520px;
      background: #7c6ff7;
      top: -120px;
      left: -120px;
      animation-delay: 0s;
    }

    .bg-blob.b {
      width: 400px;
      height: 400px;
      background: #5b8cf7;
      bottom: -80px;
      right: -80px;
      animation-delay: 3s;
    }

    .bg-blob.c {
      width: 300px;
      height: 300px;
      background: #f76f9b;
      bottom: 30%;
      left: 5%;
      animation-delay: 6s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(20px, 30px) scale(1.05);
      }
    }

    /* ─── App shell ──────────────────────────────────────── */
    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 700px;
      height: 100vh;
      max-height: 820px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border);
      backdrop-filter: blur(20px);
    }

    /* ─── Header ─────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 28px;
      background: var(--elevated);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-avatar {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--bubble-u);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px var(--glow);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(90deg, #c7c2ff, #7c6ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      display: inline-block;
      margin-right: 5px;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .header-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(124, 111, 247, 0.12);
      border: 1px solid rgba(124, 111, 247, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ─── Suggestion chips ───────────────────────────────── */
    .chips-area {
      display: flex;
      gap: 8px;
      padding: 12px 28px;
      overflow-x: auto;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .chips-area::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      background: var(--elevated);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .chip:hover {
      background: rgba(124, 111, 247, 0.15);
      border-color: var(--accent);
      color: var(--text);
      transform: translateY(-1px);
    }

    /* ─── Messages ───────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--elevated);
      border-radius: 4px;
    }

    /* ─── Message rows ─────────────────────────────────────── */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .msg-avatar.bot {
      background: linear-gradient(135deg, #7c6ff7, #5b8cf7);
    }

    .msg-avatar.user {
      background: linear-gradient(135deg, #f76f9b, #f79b6f);
    }

    .bubble {
      max-width: 72%;
      padding: 13px 17px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      position: relative;
    }

    .bubble.bot {
      background: var(--bubble-b);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .bubble.user {
      background: var(--bubble-u);
      border-bottom-right-radius: 4px;
      color: #fff;
      box-shadow: 0 4px 24px rgba(124, 111, 247, 0.35);
    }

    .bubble-time {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      display: block;
      text-align: right;
    }

    .msg-row.bot-row .bubble-time {
      text-align: left;
    }

    /* ─── Typing indicator ──────────────────────────────── */
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 17px;
      background: var(--bubble-b);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      40% {
        transform: translateY(-7px);
        opacity: 1;
      }
    }

    /* ─── Input area ─────────────────────────────────────── */
    .input-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 28px;
      background: var(--elevated);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #messageInput {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      resize: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      max-height: 100px;
      line-height: 1.5;
    }

    #messageInput::placeholder {
      color: var(--muted);
    }

    #messageInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 111, 247, 0.15);
    }

    #sendBtn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: var(--bubble-u);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
      box-shadow: 0 4px 20px rgba(124, 111, 247, 0.4);
    }

    #sendBtn:hover:not(:disabled) {
      transform: scale(1.07);
      box-shadow: 0 6px 28px rgba(124, 111, 247, 0.55);
    }

    #sendBtn:active:not(:disabled) {
      transform: scale(0.95);
    }

    #sendBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ─── Event cards ──────────────────────────────────── */
    .event-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .event-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(124, 111, 247, 0.15);
      border: 1px solid rgba(124, 111, 247, 0.3);
      color: #c4beff;
      padding: 5px 12px;
      border-radius: 24px;
      width: fit-content;
    }

    /* ─── Welcome state ──────────────────────────────────── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      text-align: center;
      padding: 32px;
      color: var(--muted);
    }

    .welcome-icon {
      font-size: 52px;
      margin-bottom: 6px;
    }

    .welcome h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .welcome p {
      font-size: 13px;
      max-width: 300px;
      line-height: 1.7;
    }

    /* ─── Error message ──────────────────────────────────── */
    .error-bubble {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: #fca5a5;
    }

    /* ─── Event cards (new) ───────────────────────────────── */
    .event-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 8px;
      font-size: 13px;
    }

    .ec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .ec-name {
      font-weight: 700;
      color: #c4beff;
      font-size: 14px;
    }

    .ec-type {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #7b82a8;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .ec-meta {
      display: flex;
      gap: 14px;
      color: #9096b8;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .ec-desc {
      color: #b0b7d6;
      font-size: 12.5px;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .ec-extra {
      font-size: 12px;
      color: #9096b8;
      margin-bottom: 4px;
      line-height: 1.5;
    }

    .ec-extra-label {
      font-weight: 600;
      color: #c4beff;
      margin-right: 4px;
    }

    .ec-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-label {
      font-size: 11px;
      color: #7b82a8;
      font-weight: 600;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 10px;
    }

    .badge.open {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .badge.closed {
      background: rgba(248, 113, 113, 0.12);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    .event-cards {
      display: flex;
      flex-direction: column;
    }

    .bot-text {
      margin-bottom: 2px;
    }

    .bot-text:empty {
      display: none;
    }

    ul {
      padding-left: 18px;
      margin: 4px 0;
    }

    li {
      margin: 3px 0;
    }
  </style>
</head>

<body>

  <!-- Background blobs -->
  <div class="bg-blob a"></div>
  <div class="bg-blob b"></div>
  <div class="bg-blob c"></div>

  <div class="app">

    <!-- ── Header ── -->
    <header class="header">
      <div class="header-avatar">🎓</div>
      <div class="header-text">
        <h1>EventBot</h1>
        <p><span class="status-dot"></span>College Event Assistant</p>
      </div>
      <span class="header-badge">NLP Powered</span>
    </header>

    <!-- ── Suggestion chips ── -->
    <div class="chips-area" id="chips">
      <button class="chip" onclick="sendChip(this)">📋 Upcoming events</button>
      <button class="chip" onclick="sendChip(this)">📝 Open registrations</button>
      <button class="chip" onclick="sendChip(this)">🙋 Volunteer opportunities</button>
      <button class="chip" onclick="sendChip(this)">📅 What's happening next?</button>
      <button class="chip" onclick="sendChip(this)">✍️ How do I register?</button>
    </div>

    <!-- ── Messages ── -->
    <main class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🎉</div>
        <h2>Hey there! I'm EventBot</h2>
        <p>Ask me anything about college events — registrations, volunteer openings, or what's coming up!</p>
      </div>
    </main>

    <!-- ── Input ── -->
    <div class="input-area">
      <textarea id="messageInput" rows="1" placeholder="Ask about events, registrations, volunteering…"></textarea>
      <button id="sendBtn" onclick="sendMessage()" title="Send">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>

  <script>
    const API_URL = 'http://127.0.0.1:8000/chat';
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcomeEl = document.getElementById('welcome');
    let sessionId = null;
    let firstMsg = true;

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function sendChip(btn) {
      inputEl.value = btn.textContent.replace(/^[^a-zA-Z0-9]+/, '').trim();
      sendMessage();
    }

    // Render **bold**, *italic*, bullet lists, newlines
    function renderMarkdown(text) {
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/[*][*](.+?)[*][*]/g, '<strong>$1</strong>')
        .replace(/[*]([^*\n]+?)[*]/g, '<em>$1</em>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/\n/g, '<br>');
    }

    // Build a single event card element
    function buildEventCard(ev) {
      var regBadge = ev.registration === 'open'
        ? '<span class="badge open">&#10003; Open</span>'
        : '<span class="badge closed">&#10005; Closed</span>';
      var volBadge = ev.volunteer === 'yes'
        ? '<span class="badge open">&#128113; Yes</span>'
        : '<span class="badge closed">&#8212; No</span>';
      var desc = ev.description
        ? '<p class="ec-desc">' + ev.description + '</p>'
        : '';
      var prizeRow = ev.prize && ev.prize !== 'N/A'
        ? '<div class="ec-extra"><span class="ec-extra-label">🏆 Prize</span> ' + ev.prize + '</div>'
        : '';
      var organizerRow = ev.organizer
        ? '<div class="ec-extra"><span class="ec-extra-label">👤 Organizer</span> ' + ev.organizer + '</div>'
        : '';
      var capacityRow = ev.capacity
        ? '<div class="ec-extra"><span class="ec-extra-label">👥 Capacity</span> ' + ev.capacity + '</div>'
        : '';
      return '<div class="event-card">'
        + '<div class="ec-header">'
        + '<span class="ec-name">' + ev.name + '</span>'
        + '<span class="ec-type">' + (ev.type || '') + '</span>'
        + '</div>'
        + '<div class="ec-meta">'
        + '<span>&#128197; ' + ev.date + '</span>'
        + '<span>&#128336; ' + (ev.time || 'TBD') + '</span>'
        + '<span>&#127963; ' + (ev.venue || 'TBD') + '</span>'
        + '</div>'
        + desc
        + organizerRow
        + capacityRow
        + prizeRow
        + '<div class="ec-badges">'
        + '<span class="badge-label">Reg</span> ' + regBadge
        + '&nbsp;&nbsp;<span class="badge-label">Vol</span> ' + volBadge
        + '</div>'
        + '</div>';
    }


    async function sendMessage() {
      var text = inputEl.value.trim();
      if (!text) return;
      if (firstMsg) { welcomeEl.remove(); firstMsg = false; }
      appendUserMessage(text);
      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
      var typingRow = appendTyping();
      try {
        var res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });
        if (!res.ok) throw new Error('Server error ' + res.status);
        var data = await res.json();
        sessionId = data.session_id;
        typingRow.remove();
        appendBotMessage(data, false);
      } catch (err) {
        typingRow.remove();
        appendBotMessage({ response: '&#9888; Could not reach the server. Is the backend running on port 8000?', events: [] }, true);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function appendUserMessage(text) {
      var now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      var row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = '<div class="msg-avatar user">&#129489;</div>'
        + '<div><div class="bubble user">' + text.replace(/</g, '&lt;') + '</div>'
        + '<span class="bubble-time">' + now + '</span></div>';
      messagesEl.appendChild(row);
      scrollBottom();
    }

    function appendBotMessage(data, isError) {
      var now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      var row = document.createElement('div');
      row.className = 'msg-row bot-row';
      var cls = isError ? 'bubble bot error-bubble' : 'bubble bot';
      var responseHtml = renderMarkdown(data.response || '');
      var cardsHtml = '';
      if (!isError && data.events && data.events.length > 0) {
        cardsHtml = '<div class="event-cards">' + data.events.map(buildEventCard).join('') + '</div>';
      }
      row.innerHTML = '<div class="msg-avatar bot">&#127891;</div>'
        + '<div><div class="' + cls + '">'
        + '<div class="bot-text">' + responseHtml + '</div>'
        + cardsHtml
        + '</div><span class="bubble-time">' + now + '</span></div>';
      messagesEl.appendChild(row);
      scrollBottom();
    }

    function appendTyping() {
      var row = document.createElement('div');
      row.className = 'msg-row bot-row';
      row.innerHTML = '<div class="msg-avatar bot">&#127891;</div>'
        + '<div class="typing-indicator">'
        + '<div class="dot"></div><div class="dot"></div><div class="dot"></div>'
        + '</div>';
      messagesEl.appendChild(row);
      scrollBottom();
      return row;
    }

    function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
  </script>

</body>

</html>
